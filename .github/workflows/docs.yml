name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private endpoints and credentials
        run: |
          ! git grep -nE '(networking\.re8ch\.com|registry\.re8ch\.com|CF_API_TOKEN|BEGIN (RSA |OPENSSH )?PRIVATE KEY)' -- ':!*.yml'

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build Markdown wiki
        run: mkdocs build --strict
      - name: Check published essentials
        run: |
          test -f site/index.html
          test -f site/quick-start/index.html
          test -f site/search/search_index.json
          test -f site/sitemap.xml
          test "$(cat site/CNAME)" = docs.advfab.org

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [boundaries, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
